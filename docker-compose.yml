# Whole stack: Postgres, the API with its worker, and the web app behind nginx.
#   CURATOR_PASSWORD=... docker compose up --build    ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vitrine
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vitrine-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrine"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vitrine:${DB_PASSWORD:-vitrine-local}@db:5432/vitrine
      CURATOR_LOGIN: ${CURATOR_LOGIN:-curator}
      CURATOR_PASSWORD: ${CURATOR_PASSWORD:?Set CURATOR_PASSWORD}
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PIPELINE: ${PIPELINE:-auto}
    volumes:
      - storage:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: viewer
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  storage:
