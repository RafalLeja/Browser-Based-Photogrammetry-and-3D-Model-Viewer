[project]
name = "photogrammetry-lib"
version = "0.1.0"
description = "Photos to 3D: COLMAP reconstruction and web-ready mesh post-processing"
readme = "README.md"
authors = [
    { email = "rafal@leja.org.pl" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "plyfile>=1.1",
    "pycolmap>=4.2.1",
    "scipy>=1.16",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
