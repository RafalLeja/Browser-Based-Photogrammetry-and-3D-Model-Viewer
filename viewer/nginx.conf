server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Photo uploads can be large; the API enforces its own per-file and total limits.
  client_max_body_size 4g;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;
  gzip_min_length 1024;

  # 'wasm-unsafe-eval' lets the Draco, Basis and meshopt decoders compile; blob: serves workers and screenshots.
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:";

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Only our own pages may frame the app (no clickjacking of sign-in or curator pages).
  add_header Content-Security-Policy "$csp; frame-ancestors 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host; # keeps the port, which the API compares with Origin
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  # Hashed build assets never change, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The embed view is meant to be framed by other sites. nginx does not inherit add_header into a
  # location that sets its own, so the other headers are repeated here.
  location /embed/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "$csp; frame-ancestors *" always;
    try_files $uri /index.html;
  }

  # Client-side routes such as /objects/3 load the app shell.
  location / {
    try_files $uri /index.html;
  }
}
