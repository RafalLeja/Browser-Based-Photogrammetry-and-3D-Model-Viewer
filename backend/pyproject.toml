[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ email = "rafal@leja.org.pl" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "photogrammetry-lib",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
photogrammetry-lib = { path = "../photogrammetry-lib", editable = true }
