[project]
name = "backend"
version = "1.0.0"
description = "Vitrine API: collection, uploads, reconstruction jobs, annotations and shared views"
readme = "README.md"
authors = [{ email = "rafal@leja.org.pl" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "photogrammetry-lib",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
# The API runs from this folder (`uvicorn app.main:app`), so it is not built as a package.
package = false

[tool.uv.sources]
photogrammetry-lib = { path = "../photogrammetry-lib", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
